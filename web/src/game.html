function throwIt(){

  distKm=Math.min(19990,60+19900*Math.pow(throwP,1.7)*(perfect?1:0.94+Math.random()*0.06));
  destLL=dest(TOKYO[0],TOKYO[1],bearing,distKm);landInfo=place(destLL[0],destLL[1],700);
  flightD=3.6+6.4*(distKm/20000);

  playMusic();say('えいこを、投げ飛ばしましたー！');fanfare();whoosh(1.2,600,4000,0.4);

  $('sHow').onclick=openHow;
  $('sTitle').onclick=function(){$('modal').classList.add('hide');toTitle()};
  $('sCopy').onclick=function(){var s=JSON.stringify(data);Platform.copy(s).then(function(ok){if(ok)toast('コピーしました。メモ等に貼り付けて保管してください');else{modal('📋 コピーして保存','<p style="font-size:14px">下の文字をすべて選択してコピーしてください。</p><textarea readonly>'+s.replace(/</g,'&lt;')+'</textarea>')}})};
  $('sPaste').onclick=function(){modal('📥 貼り付けて復元','<p style="font-size:14px">「コピーして保存」した文字を貼り付けてください。<b>今の記録は上書きされます。</b></p><textarea id="pTa" placeholder="ここに貼り付け"></textarea><div class="row" style="margin-top:10px"><button class="btn sub" id="pCancel">キャンセル</button><button class="btn main" id="pOk" style="font-size:18px;min-height:52px">上書きして復元</button></div>');
    $('pCancel').onclick=function(){$('modal').classList.add('hide')};
    $('pOk').onclick=function(){var v=$('pTa').value.trim();if(!v){toast('貼り付けてください');return}try{var o=JSON.parse(v);if(!o||o.v!==1||typeof o.stamps!=='object'||typeof o.best!=='number')throw 0;data=o;saveData();updBest();$('modal').classList.add('hide');toast('復元しました！')}catch(e){toast('形式がちがいます。コピーした文字を全部貼り付けてね')}}};
  var armed=false;$('sReset').onclick=function(){if(!armed){armed=true;this.textContent='もう一度押すとリセットします';return}data={v:1,best:0,bestPlace:'',plays:0,stamps:{},music:data.music,voice:data.voice};saveData();updBest();$('modal').classList.add('hide');toast('リセットしました')};
}
$('bGear').onclick=function(){if(holding)return;openSettings()};
$('bStart').onclick=function(){unlock();startSpin()};
$('bStamp').onclick=openStamps;$('bHow').onclick=openHow;

/* ===== 起動 ===== */
var lastTs=0;
function loop(ts){var dt=lastTs?Math.min(0.05,(ts-lastTs)/1000):0.016;lastTs=ts;st+=dt;T+=dt;try{update(dt);draw()}catch(e){if(!loaded)fatal(e.message);else console.error(e)}requestAnimationFrame(loop)}
function boot(){
  try{
    resize();initGL(imgEarth);buildMask(imgEarth);
    bgm=new Audio(ASSET_SONG);bgm.loop=true;bgm.preload='auto';
    loaded=true;$('load').classList.add('hide');$('title').classList.remove('hide');$('bGear').classList.remove('hide');updBest();go('title');
    window.__eiko={place:place,get scene(){return scene},setPower:function(p,a){holding=true;holdT=1;power=p;if(a!=null)ang=a;release()}};
    requestAnimationFrame(loop);
  }catch(e){fatal(e.message)}
}
})();
</script>
